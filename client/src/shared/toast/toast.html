<div class="alert shadow-lg flex items-center gap-3" [class]="alertClass()" (click)="navigateToRoute()" [class.cursor-pointer]="route()">
  @if (avatar()) {
    <img [src]="avatar || '/user.png'" alt="user avatar" class="w-10 h-10 rounded " />
  }
  <span>{{ message() }}</span>
  <button (click)="closeToast()" class="ml-4 btn-sm btn-ghost cursor-pointer">x</button>
</div>
